# Пример конфигурации meter_receiver в /config/configuration.yaml Home Assistant.
# Скопируйте блоки ниже в основной файл и адаптируйте под свои счётчики.

meter_receiver:
  forward_url: "http://192.168.1.50:5001/api/v1/readings"
  forward_api_key: "replace-with-the-same-api-key-from-local-api-env"
  meters:
    # entity_id — сенсор HA с показаниями (например, интеграция Элехант)
    - entity_id: sensor.svd_15_126439_water
      account: "1234567890"        # лицевой счёт
      code: "код-из-личного-кабинета"  # код ЛС для верификации (проверяет ЛК)
      meter_number: "126439"       # номер счётчика (как в ЛК)
      name: "ХВС"
      meter_type: cold_water       # cold_water | hot_water | electricity | gas | heat

    - entity_id: sensor.electricity_meter
      account: "1234567890"
      code: "код-из-личного-кабинета"
      meter_number: "7701234567"
      name: "Электроснабжение"
      meter_type: electricity
      tariffs: [day, night]        # день/ночь; по умолчанию оба

# Template-сенсоры, обновляемые событием meter_receiver_reading_received.
# Если ключ template: уже есть в configuration.yaml — добавьте только элемент списка.
template:
  - trigger:
      - platform: event
        event_type: meter_receiver_reading_received
    sensor:
      - name: "Электросчётчик — день"
        unique_id: meter_receiver_energy_day
        state: "{{ trigger.event.data.values.day }}"
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        attributes:
          meter_number: "{{ trigger.event.data.meter_number }}"
          source_name: "{{ trigger.event.data.meter_name }}"

      - name: "Электросчётчик — ночь"
        unique_id: meter_receiver_energy_night
        state: "{{ trigger.event.data.values.night }}"
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        attributes:
          meter_number: "{{ trigger.event.data.meter_number }}"
          source_name: "{{ trigger.event.data.meter_name }}"

      - name: "Счётчик ХВС"
        unique_id: meter_receiver_cold_water
        state: "{{ trigger.event.data.values.value }}"
        unit_of_measurement: "m³"
        device_class: water
        state_class: total_increasing
        attributes:
          meter_number: "{{ trigger.event.data.meter_number }}"
          source_name: "{{ trigger.event.data.meter_name }}"
